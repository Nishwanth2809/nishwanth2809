<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Nishwanth Yarra — AI engineer and full-stack developer</title>
<desc id="desc">Dark editorial engineering hero with an animated signal.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22364A" stroke-width=".65"/></pattern><linearGradient id="accent"><stop stop-color="#6BE8D4"/><stop offset="1" stop-color="#7AAEFF"/></linearGradient><clipPath id="frame"><rect width="1200" height="420" rx="16"/></clipPath><style>
text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:14px;letter-spacing:3px;font-weight:700;fill:#83EBD8}.title{font-weight:800;letter-spacing:-3.5px;font-size:88px;fill:#F4F7FB}.title-accent{fill:#83EBD8}.body{font-size:20px;fill:#B9C7D6}.micro{font-size:13px;letter-spacing:1.5px;fill:#869CB1}.signal{stroke-dasharray:260 700;stroke-dashoffset:960;animation:travel 7s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:1000px 192px}.cursor{animation:blink 1.1s steps(1) infinite}.enter{animation:enter 1s ease-out both}@keyframes travel{to{stroke-dashoffset:0}}@keyframes pulse{50%{opacity:.18;transform:scale(1.3)}}@keyframes blink{50%{opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.signal,.pulse,.cursor,.enter{animation:none!important}}
</style></defs>
