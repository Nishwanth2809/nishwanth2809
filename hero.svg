<g class="enter"><text x="66" y="132" class="eyebrow">AI ENGINEER  /  FULL-STACK DEVELOPER</text><text x="62" y="225" class="title">NISHWANTH</text><text x="62" y="313" class="title title-accent">YARRA<tspan class="cursor">_</tspan></text><text x="66" y="356" class="body">From intelligent models to software people actually use.</text></g>
